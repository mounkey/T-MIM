es:
  activerecord:
    errors:
      messages:
        record_invalid: "La validación falló: %{errors}"
        restrict_dependent_destroy:
          has_one: "No se puede eliminar el registro porque existe un %{record} dependiente"
          has_many: "No se puede eliminar el registro porque existen %{record} dependientes"
  date:
    abbr_day_names:
    - dom
    - lun
    - mar
    - mié
    - jue
    - vie
    - sáb
    abbr_month_names:
    -
    - ene
    - feb
    - mar
    - abr
    - may
    - jun
    - jul
    - ago
    - sep
    - oct
    - nov
    - dic
    day_names:
    - domingo
    - lunes
    - martes
    - miércoles
    - jueves
    - viernes
    - sábado
    formats:
      default: "%d/%m/%Y"
      long: "%A, %d de %B de %Y"
      short: "%d de %b"
    month_names:
    -
    - enero
    - febrero
    - marzo
    - abril
    - mayo
    - junio
    - julio
    - agosto
    - septiembre
    - octubre
    - noviembre
    - diciembre
    order:
    - :day
    - :month
    - :year
  errors:
    format: "%{attribute} %{message}"
    messages:
      accepted: "debe ser aceptado"
      blank: "no puede estar en blanco"
      present: "debe estar en blanco"
      confirmation: "no coincide con %{attribute}"
      empty: "no puede estar vacío"
      equal_to: "debe ser igual a %{count}"
      even: "debe ser par"
      exclusion: "está reservado"
      greater_than: "debe ser mayor que %{count}"
      greater_than_or_equal_to: "debe ser mayor o igual que %{count}"
      inclusion: "no está incluido en la lista"
      invalid: "es inválido"
      less_than: "debe ser menor que %{count}"
      less_than_or_equal_to: "debe ser menor o igual que %{count}"
      model_invalid: "La validación falló: %{errors}"
      not_a_number: "no es un número"
      not_an_integer: "debe ser un entero"
      odd: "debe ser impar"
      other_than: "debe ser distinto de %{count}"
      required: "es obligatorio"
      taken: "ya está en uso"
      too_long:
        one: "es demasiado largo (máximo 1 caracter)"
        other: "es demasiado largo (máximo %{count} caracteres)"
      too_short:
        one: "es demasiado corto (mínimo 1 caracter)"
        other: "es demasiado corto (mínimo %{count} caracteres)"
      wrong_length:
        one: "longitud errónea (debe ser de 1 caracter)"
        other: "longitud errónea (debe ser de %{count} caracteres)"

  devise:
    sessions:
      signed_in: "Sesión iniciada correctamente."
      signed_out: "Sesión cerrada correctamente."
      already_signed_out: "Sesión cerrada correctamente."
    failure:
      not_found_in_database: "Email o contraseña inválidos."
      invalid: "Email o contraseña inválidos."
      locked: "Tu cuenta está bloqueada."
      timeout: "Tu sesión ha expirado. Por favor inicia sesión nuevamente."
      inactive: "Tu cuenta aún no ha sido activada."

  time:
    am: "am"
    formats:
      default: "%A, %d de %B de %Y %H:%M"
      long: "%A, %d de %B de %Y %H:%M"
      short: "%d/%m/%Y %H:%M"
    pm: "pm"
